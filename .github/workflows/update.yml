name: Update hikes

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 07:00 Yerevan time
  workflow_dispatch:       # "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch hikes from Esora
        run: python scripts/fetch_esora.py data/hikes-raw.json
      - name: Build the site
        run: python scripts/build.py
      - name: Save changes
        run: |
          git config user.name "arahet-bot"
          git config user.email "actions@github.com"
          git add data/hikes-raw.json index.html
          git diff --cached --quiet || git commit -m "Update hikes $(date -u +%F)"
          git push
