name: Instagram hikes

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 08:00 Yerevan time
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-update   # never at the same time as the daily Esora job

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Collect posts and read them with Claude
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ig_collect.py
      - name: Build the site
        if: always()
        run: python scripts/build.py
      - name: Save changes
        if: always()
        run: |
          git config user.name "arahet-bot"
          git config user.email "actions@github.com"
          git add data index.html
          git diff --cached --quiet || git commit -m "Instagram hikes $(date -u +%F)"
          git pull --rebase -q && git push
